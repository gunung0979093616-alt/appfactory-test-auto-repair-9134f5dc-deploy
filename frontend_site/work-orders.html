<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工單佇列｜汽車維修營運中心</title><link rel="stylesheet" href="/automotive-app.css"></head><body>
<header><strong>工單佇列</strong><nav><a href="/">首頁</a><a href="/intake.html">接車建檔</a><a href="/resources.html">資源媒合</a><a href="/admin/index.html">管理後台</a></nav></header><main><h1>各門市維修進度</h1><p class="lead">讀取目前隔離環境中的真實工單狀態，不用靜態範例冒充後端資料。</p><section class="panel"><div class="grid"><div><label>門市</label><select id="shop"><option value="shop-01">北區店</option><option value="shop-02">中區店</option><option value="shop-03">南區店</option></select></div><div><label>狀態篩選</label><select id="status"><option value="">全部</option><option value="inspection">檢查中</option><option value="waiting_parts">待料</option><option value="waiting_quote_approval">待核價</option><option value="repairing">維修中</option><option value="completed">已交車</option></select></div></div><button id="load">載入工單</button><div id="result" class="cards result">尚未載入。</div></section></main><footer>工單資料由 list_repair_work_queue MCP 工具讀取。</footer><script src="/automotive-app.js"></script><script>load.addEventListener('click',async()=>{result.textContent='讀取中…';try{const data=await AutomotiveApp.callTool('list_repair_work_queue',{shop_id:shop.value,status:status.value});result.innerHTML=data.items.length?data.items.map(x=>`<article class="card"><span class="status">${x.status}</span><h3>${x.id}</h3><p>車牌：${x.plate_number}</p><p>初檢：${(x.inspection_items||[]).join('、')}</p></article>`).join(''):'目前沒有符合條件的工單。';}catch(error){result.textContent='讀取失敗：'+error.message;}});</script></body></html>
