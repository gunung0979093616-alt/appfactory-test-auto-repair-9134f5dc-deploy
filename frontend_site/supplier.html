<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>供應商資料匯入</title><style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f5f7fb}body{margin:0;padding:24px}main{max-width:760px;margin:auto;display:grid;gap:18px}section{background:white;border:1px solid #d7deea;border-radius:18px;padding:22px}label{display:grid;gap:6px;margin:12px 0}input,button,a{font:inherit}input{padding:11px;border:1px solid #9aa8bd;border-radius:9px}button,.button{display:inline-block;padding:11px 16px;border:0;border-radius:10px;background:#087f8c;color:white;text-decoration:none;cursor:pointer}button[disabled]{opacity:.55}.status{padding:12px;border-radius:10px;background:#e8f6f2;color:#17463d}.error{background:#fff0f0;color:#7b1e1e}small{color:#526174}</style></head><body><main>
<header><h1>auto-repair供應商資料匯入</h1><p>沒有 API 也可以上架。先下載範本，整理商品、房源或活動資料，再上傳成候選批次；只有驗證通過且管理者確認後才會發布。</p></header>
<section><h2>1. 準備檔案</h2><p>支援 CSV、JSON、XLSX，單檔上限 5 MB。請保留項目編號、名稱、狀態、價格與庫存欄位。</p><a class="button" href="/supplier-template.csv">下載欄位範本</a></section>
<section><h2>2. 上傳並檢查</h2><form id="upload"><label>供應商代號<input name="supplier_id" required autocomplete="off"></label><label>資料檔案<input name="file" type="file" accept=".csv,.json,.xlsx" required></label><button>上傳檢查</button></form><p id="status" class="status" hidden></p></section>
<section><h2>3. 確認發布</h2><p>系統會顯示總筆數、可發布筆數與錯誤筆數。若有錯誤，先修正原檔再重新上傳；不會直接覆蓋公開資料。</p><button id="publish" disabled>確認發布候選批次</button></section>
<p><small>權限說明：上傳與發布只允許同專案管理者。若尚未完成登入或後端授權，畫面會顯示權限不足，不會寫入。</small></p>
</main><script>
const form=document.getElementById('upload'),statusEl=document.getElementById('status'),publish=document.getElementById('publish');let batchId='';
function show(message,error=false){statusEl.hidden=false;statusEl.className=error?'status error':'status';statusEl.textContent=message}
form.addEventListener('submit',async event=>{event.preventDefault();publish.disabled=true;show('正在檢查檔案…');try{const response=await fetch('/api/admin/imports',{method:'POST',body:new FormData(form),credentials:'same-origin'}),data=await response.json();if(!response.ok||data.status==='error')throw new Error(data.message||'上傳失敗');batchId=data.batch_id;show(`已讀取 ${data.row_count} 筆；可發布 ${data.valid_count} 筆；錯誤 ${data.error_count} 筆。`);publish.disabled=!data.can_publish}catch(error){show(error.message||'上傳失敗，請稍後重試。',true)}});
publish.addEventListener('click',async()=>{if(!batchId||!confirm('確定發布這個已驗證批次嗎？'))return;publish.disabled=true;show('正在發布…');try{const response=await fetch(`/api/admin/imports/${encodeURIComponent(batchId)}/publish`,{method:'POST',credentials:'same-origin'}),data=await response.json();if(!response.ok||data.status!=='published')throw new Error(data.message||'發布失敗');show(`已發布 ${data.published_rows} 筆資料，版本：${data.version}。`)}catch(error){show(error.message||'發布失敗，請稍後重試。',true);publish.disabled=false}});
</script></body></html>
