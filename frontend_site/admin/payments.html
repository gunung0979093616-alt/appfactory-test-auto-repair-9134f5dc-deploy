<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>auto-repair｜付款與權益管理</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;margin:0;background:#f8fafc;color:#172033}main{max-width:1080px;margin:auto;padding:40px 20px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:20px;padding:22px;margin:16px 0}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #dbe3ef}.scroll{overflow-x:auto}</style></head><body><main><h1>auto-repair：付款與權益管理</h1><p>管理者可掌握每筆訂單是一次購買、固定期間或固定次數，並查看購買時間、生效時間、到期時間、剩餘額度、退款及對帳狀態。</p><section class="card"><h2>系統如何自動管制</h2><ul><li>付款通過安全驗證後，才記錄購買時間並開通權益。</li><li>固定期間從付款確認時開始計算，到期後自動判定為已到期。</li><li>一次購買沒有期限時維持有效；有指定期限或次數時依方案規則管制。</li><li>方案日後修改不會改掉歷史訂單、既有到期日或已購買額度。</li></ul></section><section class="card scroll"><h2>訂單與權益</h2><table><thead><tr><th>購買方式</th><th>購買時間</th><th>生效時間</th><th>到期時間</th><th>剩餘天數／額度</th><th>付款／退款狀態</th></tr></thead><tbody><tr><td colspan="6">登入管理者帳號後，由後端安全載入本專案資料。</td></tr></tbody></table></section></main></body></html>
