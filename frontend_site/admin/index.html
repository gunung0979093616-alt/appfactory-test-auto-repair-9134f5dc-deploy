<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>營運管理後台｜汽車維修營運中心</title>
  <link rel="stylesheet" href="/automotive-app.css">
</head>
<body>
  <header>
    <strong>營運管理後台</strong>
    <nav>
      <a href="/">營運首頁</a>
      <a href="/intake.html">接車開單</a>
      <a href="/work-orders.html">維修工單</a>
      <a href="/resources.html">工位與技師</a>
    </nav>
  </header>
  <main>
    <h1>三店等待與未結案件</h1>
    <p class="lead">這個後台直接呼叫診斷與工單工具，不再只是開發助手模板的靜態管理頁。</p>
    <section id="shops" class="grid" aria-live="polite"></section>
    <section class="panel">
      <h2>真實邊界</h2>
      <p>目前只保存隔離測試資料。Google 登入、員工角色權限、正式簡訊／LINE、供應商零件資料與永久資料庫，必須另有專案擁有者授權與正式環境證據。</p>
    </section>
  </main>
  <footer>管理後台 · 診斷資料與工單數量均來自此 App 的 MCP runtime。</footer>
  <script src="/automotive-app.js"></script>
  <script>
    (async () => {
      const target = document.querySelector('#shops');
      target.innerHTML = '<article class="panel">載入三店營運資料…</article>';
      try {
        const shops = ['shop-01', 'shop-02', 'shop-03'];
        const cards = await Promise.all(shops.map(async (shopId) => {
          const [diagnosis, queue] = await Promise.all([
            AutomotiveApp.callTool('diagnose_wait_bottlenecks', { shop_id: shopId }),
            AutomotiveApp.callTool('list_repair_work_queue', { shop_id: shopId })
          ]);
          const root = diagnosis.structuredContent || diagnosis;
          const work = queue.structuredContent || queue;
          const count = Array.isArray(work.work_orders) ? work.work_orders.length : (work.count || 0);
          return `<article class="panel"><p class="eyebrow">${AutomotiveApp.escapeHtml(shopId)}</p><h2>${count} 件未結工單</h2><p>根因已驗證：${root.root_cause_verified ? '是' : '否，需持續蒐證'}</p><details><summary>查看診斷證據</summary><pre>${AutomotiveApp.escapeHtml(JSON.stringify(root, null, 2))}</pre></details></article>`;
        }));
        target.innerHTML = cards.join('');
      } catch (error) {
        target.innerHTML = `<article class="panel error"><h2>資料載入失敗</h2><p>${AutomotiveApp.escapeHtml(error.message)}</p></article>`;
      }
    })();
  </script>
</body>
</html>
