<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資源媒合｜汽車維修營運中心</title><link rel="stylesheet" href="/automotive-app.css"></head><body>
<header><strong>技師與工位媒合</strong><nav><a href="/">首頁</a><a href="/intake.html">接車建檔</a><a href="/work-orders.html">工單佇列</a><a href="/admin/index.html">管理後台</a></nav></header><main><h1>先讀工單，再提供技師候選</h1><p class="lead">媒合工具只提供候選，不會在未確認前直接改派。工位指派則需要明確確認與唯一操作碼。</p><section class="grid"><div class="panel"><label>工單編號</label><input id="orderId" placeholder="repair_..."><button id="lookup" class="secondary">讀取工單</button><button id="match">比對技師技能</button></div><div class="panel"><h2>查詢結果</h2><div id="result" class="result">請輸入工單編號。</div></div></section></main><footer>這一頁對應 get_repair_order 與 match_technician_skills。</footer><script src="/automotive-app.js"></script><script>lookup.addEventListener('click',async()=>{try{result.textContent=AutomotiveApp.formatJson(await AutomotiveApp.callTool('get_repair_order',{repair_order_id:orderId.value}));}catch(e){result.textContent=e.message}});match.addEventListener('click',async()=>{try{result.textContent=AutomotiveApp.formatJson(await AutomotiveApp.callTool('match_technician_skills',{repair_order_id:orderId.value}));}catch(e){result.textContent=e.message}});</script></body></html>
