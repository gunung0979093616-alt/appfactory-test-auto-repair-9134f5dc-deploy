<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接車建檔｜汽車維修營運中心</title><link rel="stylesheet" href="/automotive-app.css"></head><body>
<header><strong>接車建檔</strong><nav><a href="/">首頁</a><a href="/work-orders.html">工單佇列</a><a href="/resources.html">資源媒合</a><a href="/admin/index.html">管理後台</a></nav></header>
<main><h1>接車後直接建立可追蹤工單</h1><p class="lead">這不是展示表單。送出後會依序呼叫「建立接車紀錄」與「建立維修工單」，並回傳真正的 intake_id 與 repair_order_id。</p><section class="grid"><form id="intakeForm" class="panel"><label>門市</label><select id="shop"><option value="shop-01">北區店</option><option value="shop-02">中區店</option><option value="shop-03">南區店</option></select><label>車牌</label><input id="plate" required placeholder="TEST-001"><label>里程</label><input id="mileage" type="number" min="0" value="42000"><label>車主反映</label><textarea id="concern" required placeholder="例如：煞車時有異音"></textarea><label>初檢項目（逗號分隔）</label><input id="items" value="煞車,底盤"><button type="submit">確認建立接車與工單</button></form><aside class="panel"><span class="status">受確認寫入</span><h2>建立結果</h2><div id="result" class="result">尚未建立。</div></aside></section></main><footer>測試資料只屬於此隔離 App；正式客戶資料與 Google 身分尚未啟用。</footer>
<script src="/automotive-app.js"></script><script>document.getElementById('intakeForm').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('result');out.textContent='建立中…';try{const intake=await AutomotiveApp.callTool('create_vehicle_intake',{shop_id:shop.value,plate_number:plate.value,mileage_km:Number(mileage.value),customer_concern:concern.value,confirmed:true,idempotency_key:AutomotiveApp.operationKey('intake')});const order=await AutomotiveApp.callTool('create_repair_order',{intake_id:intake.vehicle_intake.id,inspection_items:items.value.split(',').map(x=>x.trim()).filter(Boolean),confirmed:true,idempotency_key:AutomotiveApp.operationKey('order')});out.textContent=`接車編號：${intake.vehicle_intake.id}\n工單編號：${order.repair_order.id}\n狀態：${order.repair_order.status}`;}catch(error){out.textContent='建立失敗：'+error.message;}});</script></body></html>
