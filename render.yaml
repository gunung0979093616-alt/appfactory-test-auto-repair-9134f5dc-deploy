services:
  - type: web
    name: auto-repair-plugin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APPFACTORY_SESSION_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: PUBLIC_CHECKOUT_ENABLED
        value: "false"
      - key: MCP_AUTH_MODE
        value: none
      - key: RENDER_SERVICE_ID
        sync: false
      - key: RENDER_WORKSPACE_ID
        sync: false
