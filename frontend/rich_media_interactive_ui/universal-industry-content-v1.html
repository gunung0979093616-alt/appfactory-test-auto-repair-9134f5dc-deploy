<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>跨產業內容</title><style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;padding:16px}main{display:grid;gap:12px}.items{display:grid;gap:12px}.grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.card{border:1px solid #8885;border-radius:14px;padding:14px}.media{max-width:100%;height:auto;border-radius:10px}.carousel{display:flex;overflow:auto;scroll-snap-type:x mandatory}.carousel>.card{min-width:75%;scroll-snap-align:start}table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid #8885;text-align:left}.bars{display:grid;gap:8px}.bar{background:#2f80ed;color:white;padding:6px;min-width:3rem}.actions{display:flex;flex-wrap:wrap;gap:8px}button,a.action{border:1px solid #8887;border-radius:999px;padding:8px 12px;background:transparent;color:inherit;text-decoration:none}.notice{padding:12px;border-radius:10px;background:#8882}</style></head><body><main id="app" aria-live="polite"><p class="notice">正在載入…</p></main><script>
const app=document.getElementById('app'),states=new Set(['loading','success','empty','error','unauthorized','quota_exhausted','partial','payment_required']);
const safeUrl=v=>{try{const u=new URL(v);return u.protocol==='https:'?u.href:null}catch{return null}};const el=(t,x,c)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=String(x);return n};
function mediaNode(m){const u=safeUrl(m&&m.url);if(!u)return el('p','媒體網址無效','notice');if(m.kind==='video'){const v=el('video');v.className='media';v.controls=true;v.playsInline=true;v.preload='metadata';v.src=u;const p=safeUrl(m.poster_url);if(p)v.poster=p;return v}const i=el('img');i.className='media';i.src=u;i.alt=m.alt||'內容圖片';i.loading='lazy';i.addEventListener('error',()=>i.replaceWith(el('p','圖片暫時無法載入','notice')));return i}
function card(item){const c=el('article',null,'card');c.append(el('h3',item.title||'未命名項目'));if(item.summary)c.append(el('p',item.summary));if(item.price_label)c.append(el('strong',item.price_label));(item.media||[]).forEach(m=>c.append(mediaNode(m)));if(item.fields){const d=el('dl');Object.entries(item.fields).forEach(([k,v])=>d.append(el('dt',k),el('dd',v)));c.append(d)}return c}
function cards(d,t){const b=el('section',null,'items '+(t==='carousel'?'carousel':'grid'));(d.items||[]).forEach(i=>b.append(card(i)));return b}function table(d){const t=el('table'),h=el('tr');(d.columns||[]).forEach(c=>h.append(el('th',c)));const th=el('thead');th.append(h);t.append(th);const body=el('tbody');(d.items||[]).forEach(i=>{const r=el('tr');(d.columns||[]).forEach(c=>r.append(el('td',(i.fields||{})[c]??'')));body.append(r)});t.append(body);return t}function chart(d){const b=el('section',null,'bars'),vs=(d.items||[]).map(i=>Number(i.value)||0),max=Math.max(1,...vs);(d.items||[]).forEach((i,n)=>{const x=el('div',(i.label||i.title)+': '+vs[n],'bar');x.style.width=Math.max(12,vs[n]/max*100)+'%';b.append(x)});return b}
function mapView(d){const b=el('section',null,'items grid');(d.items||[]).forEach(i=>{const c=card(i),lat=Number(i.latitude),lon=Number(i.longitude);if(Number.isFinite(lat)&&Number.isFinite(lon)){const a=el('a','在地圖開啟','action');a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(lat+','+lon);a.target='_blank';a.rel='noopener noreferrer';c.append(a)}b.append(c)});return b}
function formView(d){const f=el('form',null,'card');f.addEventListener('submit',e=>{e.preventDefault();f.append(el('p','已保留輸入；必須確認後才會交由後端寫入工具處理。','notice'))});(d.items||[]).forEach(i=>{const label=el('label',i.title||i.label||'欄位'),input=el('input');input.name=i.id;input.required=Boolean((i.fields||{}).required);label.append(input);f.append(label)});const submit=el('button','檢查輸入');submit.type='submit';f.append(submit);return f}
function action(a){const u=safeUrl(a.url);if(a.kind==='navigation'&&u){const n=el('a',a.label,'action');n.href=u;n.target='_blank';n.rel='noopener noreferrer';n.addEventListener('click',e=>{if(window.openai?.openExternal){e.preventDefault();window.openai.openExternal({href:u})}});return n}const n=el('button',a.label);n.type='button';n.addEventListener('click',async()=>{const writes=['write','transaction'].includes(a.kind);if(!a.tool_name){app.append(el('p','這個操作沒有對應工具，尚未變更任何資料。','notice'));return}if(writes&&(a.requires_confirmation!==false)&&!window.confirm('這個操作會送出資料，確定繼續嗎？'))return;if(!window.openai?.callTool){app.append(el('p','目前環境不支援互動工具，請在對話中要求 ChatGPT 執行。','notice'));return}n.disabled=true;const status=el('p','正在處理…','notice');app.append(status);try{const transaction=a.kind==='transaction',idempotency_key=transaction?(a.arguments?.idempotency_key||crypto.randomUUID()):undefined;const result=await window.openai.callTool(a.tool_name,{...(a.arguments||{}),...(writes?{confirmed:true}:{}),...(transaction?{idempotency_key}:{})});status.remove();render(result)}catch(error){status.textContent='操作失敗，請檢查權限或稍後重試。';n.disabled=false}});return n}
function render(input){const d=input&&input.structuredContent?input.structuredContent:input||{},s=states.has(d.state)?d.state:'success';app.replaceChildren();app.append(el('h2',d.title||'查詢結果'));if(d.summary)app.append(el('p',d.summary));const labels={loading:'正在載入…',empty:'目前沒有資料',error:'資料載入失敗',unauthorized:'請先登入或取得權限',quota_exhausted:'可用額度已用完',payment_required:'需要完成方案解鎖'};const upgrade=['quota_exhausted','payment_required'].includes(s);if(!['success','partial'].includes(s)){app.append(el('p',d.message||labels[s]||s,'notice'));if(!upgrade||!((d.items&&d.items.length)||(d.actions&&d.actions.length)))return}if(s==='partial')app.append(el('p',d.message||'目前顯示部分結果','notice'));const type=d.content_type||'list';let view;if(type==='table')view=table(d);else if(type==='chart'||type==='dashboard')view=chart(d);else if(type==='map')view=mapView(d);else if(type==='form')view=formView(d);else view=cards(d,type);view.dataset.renderer=type;app.append(view);if(d.actions?.length){const a=el('section',null,'actions');d.actions.forEach(x=>a.append(action(x)));app.append(a)}}
window.addEventListener('message',e=>{const m=e.data||{};if(m.method==='ui/notifications/tool-result')render(m.params?.structuredContent||m.params?.result?.structuredContent||m.params)});if(window.openai?.toolOutput)render(window.openai.toolOutput);else render({state:'loading',content_type:'list',title:'跨產業內容'});
</script></body></html>
